services:
  postgres:
    image: postgres:17-alpine
    container_name: nestjs-poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the extra "tasks_test" database used by the e2e tests (first start only).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasks -d tasks']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
